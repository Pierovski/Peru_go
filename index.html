<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perú Go - Personal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1118">
    <link rel="apple-touch-icon" href="./assets/img/mascota-feliz.webp">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Paytone+One&display=swap" rel="stylesheet">
</head>
<body>
    <button id="btn-actualizar-app" style="position: fixed; bottom: 5px; right: 5px; z-index: 10001; background: transparent; color: rgba(255,255,255,0.2); border: none; font-size: 0.6rem; cursor: pointer; font-family: 'Montserrat', sans-serif;">actualizar</button>
    
    <div id="pantalla-acceso">
        <div class="acceso-flotante">
            <img src="./assets/img/mascota-hola.webp" id="avatar-guia" alt="Guía">
            <p class="instruccion">Clave de Expedición</p>
            <div class="input-wrapper">
                <input type="password" id="pass" placeholder="••••">
            </div>
            <button id="btn-ingresar">Entrar</button>
        </div>
    </div>

    <div id="contenedor-filtro" class="filtro-flotante">
        <select id="filtro-mapa" class="select-chicha">
            <option value="TODOS">🌍 Todos los mundos</option>
            <option value="TRABAJO">🚜 Solo Proyectos</option>
            <option value="PERSONAL">🍹 Solo Personal</option>
        </select>
    </div>

    <div id="pantalla-info" style="display: none;">
        <div class="info-contenido" id="panel-tarjeta-viajes">
            <button id="btn-cerrar-info">✖</button>
            <h2 id="info-provincia-titulo" class="titulo-chicha">PROVINCIA</h2>
            
            <div id="info-lugares">
                <p style="color: white; font-size: 1.2rem;">Cargando bitácora de la nube...</p>
            </div>

            <button id="btn-mostrar-formulario" class="btn-chicha" style="margin-top: 15px;">+ Añadir Expedición</button>
            
            <div id="formulario-registro" style="display: none; margin-top: 20px; border-top: 2px dashed #FF1493; padding-top: 20px;">
                
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <select id="nuevo-tipo" class="input-chicha" style="width: 50%; margin-bottom: 0;">
                        <option value="PERSONAL">🍹 Viaje Personal</option>
                        <option value="TRABAJO">🚜 Proyecto / Obra</option>
                    </select>
                    <select id="nueva-compania" class="input-chicha" style="width: 50%; margin-bottom: 0;">
                        <option value="Solo">👤 Solo</option>
                        <option value="Pareja">❤️ Pareja</option>
                        <option value="Familia">👨‍👩‍👧‍👦 Familia</option>
                        <option value="Equipo Obra">👷 Equipo Obra</option>
                        <option value="Mascota">🐕 Mascota</option>
                    </select>
                </div>

                <input type="text" id="nuevo-nombre" placeholder="Lugar o Proyecto" class="input-chicha">
                <input type="text" id="nuevo-estado" placeholder="Estado (ej. Visitado ✅)" class="input-chicha">
                <input type="text" id="nueva-fecha" placeholder="Fecha (ej. Mayo 2026)" class="input-chicha">
                <textarea id="nueva-info" placeholder="Detalles de la expedición..." class="input-chicha"></textarea>
                <input type="url" id="nuevo-link" placeholder="Enlace externo (Drone, Civil 3D, Drive...)" class="input-chicha">
                
                <p style="color: #00FA9A; font-size: 0.8rem; margin: 5px 0; text-align: left;">Adjuntar Fotos (Deja en blanco para conservar las actuales):</p>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="file" id="foto-1" accept="image/*" class="file-chicha">
                    <input type="file" id="foto-2" accept="image/*" class="file-chicha">
                </div>
                
                <button id="btn-guardar-registro" class="btn-chicha" style="background: linear-gradient(90deg, #00FFFF, #00FA9A);">💾 Guardar en la Nube</button>
                <button id="btn-cancelar-edicion" class="btn-chicha" style="display: none; background: #FF4500; margin-top: 10px; color: white;">❌ Cancelar Edición</button>
                
                <p id="mensaje-carga" style="color: #FFD700; font-weight: bold; display: none; margin-top: 10px;">Procesando en la nube, no cierres... ⏳</p>
            </div>
        </div>
    </div>

    <h1 id="titulo-mapa" class="titulo-chicha">PERÚ <span class="go-text">GO</span></h1>
    <h2 id="titulo-departamento" class="titulo-chicha"></h2>
    
    <button id="btn-volver" class="btn-flotante-volver" style="display: none;">🔙</button>
    <div id="map"></div>
    
    <button id="btn-filtro" class="btn-flotante" style="display: none; bottom: 180px; left: 20px; border-color: #00FFFF; box-shadow: 0 0 10px #00FFFF; font-size: 1.2rem;">🌍</button>
    <button id="btn-mute" class="btn-flotante" style="display: none;">🔊</button>

    <div id="contenedor-progreso">
        <div id="barra-fondo">
            <div id="barra-relleno"></div>
        </div>
        <img src="./assets/img/mascota-explora.webp" id="mascota-progreso" alt="Explorador">
        <span id="texto-progreso">0%</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
